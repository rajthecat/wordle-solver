---
# Source: wordle-solver-frontend/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    helm.sh/chart: wordle-solver-frontend-0.1.0
    app.kubernetes.io/name: wordle-solver-frontend
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  nginx.conf: |
    # The identifier backend is internal to nginx, and used to name this specific upstream
    upstream backend {
        # The internal DNS name used by the backend Service inside Kubernetes
        server wordl-solver-backend-service:4000;
    }
    server {
        listen       80;
        listen       4000;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
        location /wordl {
            # The following statement will proxy traffic to the upstream named backend
            proxy_pass http://backend/wordl;
        }
        #error_page  404              /404.html;
        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
