---
# Source: wordle-solver-frontend/charts/wordle-solver-backend/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-wordle-solver-backend
  labels:
    helm.sh/chart: wordle-solver-backend-0.1.0
    app.kubernetes.io/name: wordle-solver-backend
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordle-solver-backend
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordle-solver-backend
        app.kubernetes.io/instance: release-name
    spec:
      containers:
        - name: wordle-solver-backend
          image: "rajthecat/wordl-solver-backend:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          resources:
            {}
