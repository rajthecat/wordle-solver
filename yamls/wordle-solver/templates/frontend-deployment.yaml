---
# Source: wordle-solver/templates/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-wordle-solver-frontend-deployment
  labels:
    tier: frontend
    helm.sh/chart: wordle-solver-0.1.3
    app.kubernetes.io/name: wordle-solver
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: frontend
      app.kubernetes.io/name: wordle-solver
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        tier: frontend
        app.kubernetes.io/name: wordle-solver
        app.kubernetes.io/instance: release-name
    spec:
      containers:
      - name: wordle-solver-frontend
        image: "rajthecat/wordl-solver-frontend:latest"
        imagePullPolicy: Always
        ports:
          - name: http
            containerPort: 80
            protocol: TCP
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: release-name-wordle-solver-frontend-configmap
