---
# Source: wordle-solver/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-wordle-solver-backend-deployment
  labels:
    tier: backend
    helm.sh/chart: wordle-solver-0.1.3
    app.kubernetes.io/name: wordle-solver
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: backend
      app.kubernetes.io/name: wordle-solver
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        tier: backend
        app.kubernetes.io/name: wordle-solver
        app.kubernetes.io/instance: release-name
    spec:
      containers:
      - name: wordle-solver-backend
        image: "rajthecat/wordl-solver-backend:latest"
        imagePullPolicy: Always
        ports:
          - name: http
            containerPort: 4000
            protocol: TCP
