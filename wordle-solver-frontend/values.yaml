# Default values for wordle-solver-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: rajthecat/wordl-solver-frontend
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

service:
  type: LoadBalancer
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

volumeMounts:
  name: conf
  mountPath: "/etc/nginx/conf.d"

volumes:
  name: conf
  configMap:
    name: nginx-conf

configMapData:
  nginx.conf: |
    # The identifier backend is internal to nginx, and used to name this specific upstream
    upstream backend {
        # The internal DNS name used by the backend Service inside Kubernetes
        server wordl-solver-backend-service:4000;
    }
    server {
        listen       80;
        listen       4000;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
        location /wordl {
            # The following statement will proxy traffic to the upstream named backend
            proxy_pass http://backend/wordl;
        }
        #error_page  404              /404.html;
        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
