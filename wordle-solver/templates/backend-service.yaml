apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordle-solver-backend-service
  labels:
    tier: backend
    {{- include "wordle-solver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    tier: backend
    {{- include "wordle-solver.labels" . | nindent 4 }}