apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordle-solver-backend-deployment
  labels:
    tier: backend
    {{- include "wordle-solver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      tier: backend
      {{- include "wordle-solver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        tier: backend
        {{- include "wordle-solver.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}-backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ .Values.backend.service.port }}
            protocol: TCP