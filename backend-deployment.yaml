apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordl-solver-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordl-solver
      tier: backend
  template:
    metadata:
      labels:
        app: wordl-solver
        tier: backend
    spec:
      containers:
      - name: wordl-solver-backend
        image: rajthecat/wordl-solver-backend:latest
        imagePullPolicy: Always
        resources:
          limits:
            memory: "356Mi"
            cpu: "500m"
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: wordl-solver-backend-service
spec:
  selector:
    app: wordl-solver
    tier: backend
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
    