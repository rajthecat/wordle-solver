apiVersion: v1
kind: Service
metadata:
  name: wordl-solver-backend-service
  labels:
    {{- include "wordle-solver-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wordle-solver-backend.selectorLabels" . | nindent 4 }}
